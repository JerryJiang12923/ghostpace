<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卷灵</title>
<style>html{background:#16120d}</style><!-- 防白闪：完整 CSS 由下方引导注入 -->
</head>
<body>

<!-- 卷库 -->
<section class="screen" id="s-library">
  <div class="greet">卷 灵<small>GHOSTPACE</small></div>
  <div class="netline"><span class="dot off" id="bridgeDot"></span> <span id="netTxt">本地桥检测中…</span></div>
  <div class="sec">待 战 卷</div>
  <div id="paperList"></div>
</section>

<!-- 赛前 -->
<section class="screen" id="s-brief">
  <div class="brief-head">
    <span class="tag red" id="briefTag">科目</span>
    <h2 id="briefTitle">—</h2>
    <p id="briefHist" class="brief-hist" style="display:none"></p>
  </div>
  <div class="stat-row">
    <div class="stat"><b class="num" id="bStatN">–</b><span>题目</span></div>
    <div class="stat"><b class="num" id="bStatT">–</b><span>幽灵预测完卷</span></div>
    <div class="stat"><b class="num" id="bStatAvg">–</b><span>题均</span></div>
  </div>
  <div class="qmap">
    <div class="lbl"><span>逐题预估 · 等高条</span><span>深色 = 难题</span></div>
    <div class="qbars" id="qbars"></div>
  </div>
  <div class="sec">幽 灵 档 位</div>
  <div class="levels">
    <button class="level" data-lv="1.15">轻松<small>×1.15 · 找信心</small></button>
    <button class="level sel" data-lv="1.0">标准<small>×1.0 · 势均力敌</small></button>
    <button class="level" data-lv="0.85">挑战<small>×0.85 · 燃烧</small></button>
  </div>
  <div id="briefSpacer" style="flex:1"></div>
  <button class="btn btn-primary" id="btnStart" style="padding:18px 0">开 卷</button>
  <div id="restartRow" style="display:none">
    <button class="btn btn-ghost" id="btnRestartNo" style="flex:1;padding:12px 0">取消</button>
    <button class="btn btn-primary" id="btnRestartYes" style="flex:2;padding:12px 0">放弃当前比赛，重开</button>
  </div>
</section>

<!-- 赛中 -->
<section class="screen" id="s-race">
  <div class="race-top">
    <div class="elapsed num" id="elapsed">0:00</div>
    <div class="target">幽灵预计完卷<br><span class="num" id="ghostEta">–</span></div>
  </div>
  <div class="track-wrap">
    <div class="track">
      <div class="ticks" id="ticks"></div>
      <div class="marker you" id="mkYou" style="left:0%"><em>你</em><i></i></div>
      <div class="marker ghost" id="mkGhost" style="left:0%"><em class="num" id="mkGhostQ"></em><i></i></div>
    </div>
  </div>
  <div class="glimpse">
    <span id="glimpseTxt">幽灵尚未动笔</span>
    <span class="stale" id="glimpseAge"></span>
  </div>
  <div class="behind even" id="behind">蓄势</div>
  <div class="race-mid">
    <div class="qno num" id="qno">1</div>
    <div class="qtype" id="qtype"></div>
  </div>
  <button class="done-btn" id="btnDone">✓ 写完这题<small id="btnDoneSub"></small></button>
  <div class="race-sub">
    <button class="btn btn-ghost" id="btnSkip">跳题 →</button>
    <button class="btn btn-ghost" id="btnPause">❚❚ 暂停</button>
  </div>
</section>

<!-- 结算 -->
<section class="screen" id="s-result">
  <div class="res-head">
    <div class="seal" id="rSeal">胜</div>
    <div><h2 id="rHead">—</h2><p id="rSub">—</p></div>
  </div>
  <div class="vs">
    <div class="col me"><span>你</span><b class="num" id="rYou">–</b></div>
    <div class="col gh"><span>幽灵</span><b class="num" id="rGhost">–</b></div>
  </div>
  <div class="qreview chart">
    <div class="lbl">比赛过程 · 金 = 你　青 = 幽灵</div>
    <div id="rChart"></div>
  </div>
  <div class="qreview">
    <div class="lbl">逐题对照 · 灰 = 预测　金 = 实际　红 = 超时</div>
    <div id="rRows"></div>
  </div>
  <div class="res-actions">
    <button class="btn btn-primary" id="btnAgain">再来一卷</button>
    <button class="btn btn-ghost" id="btnShot">存图</button>
    <button class="btn btn-ghost" id="btnBack">回卷库</button>
  </div>
</section>

<div class="overlay" id="countdown"></div>
<div class="overlay" id="pauseOv">
  <div class="box">
    <h2>暂 停</h2>
    <p id="pauseWhy">幽灵也停下了</p>
    <div id="abortBar" style="display:none;align-items:center;justify-content:center;gap:10px;margin:-8px 0 20px;font-size:13px;color:var(--dim)">
      <span>确定放弃？不保存进度</span>
      <button class="btn btn-ghost" id="btnAbortYes" style="display:inline-flex;padding:8px 18px;font-size:13px;color:var(--red);border-color:var(--red)">确认放弃</button>
    </div>
    <button class="btn btn-primary" id="btnResume" style="padding:16px 60px">继 续</button>
    <button class="btn btn-ghost" id="btnAbort" style="padding:14px 0;margin-top:12px">放弃比赛</button>
  </div>
</div>

<div class="overlay" id="shotOv">
  <div class="shotbox"><img id="shotImg" alt=""><p>长按图片保存 · 点空白处关闭</p></div>
</div>

<nav id="nav">
  <a href="#/library" data-s="s-library">卷库</a>
  <a href="#/brief" data-s="s-brief">赛前</a>
  <a href="#/race" data-s="s-race">赛中</a>
  <a href="#/result" data-s="s-result">结算</a>
</nav>

<script>
// 运行期破缓存：子资源 URL 带毫秒戳，每次打开都是最新；本文件永不随构建变化
(function () {
  var t = Date.now();
  var link = document.createElement('link');
  link.rel = 'stylesheet'; link.href = 'style.css?t=' + t;
  document.head.appendChild(link);
  ['papers.js', 'ghost.js', 'app.js'].forEach(function (f) {
    var s = document.createElement('script');
    s.src = f + '?t=' + t; s.async = false;  // async=false 保证按序执行
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
